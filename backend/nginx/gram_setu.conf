# ─────────────────────────────────────────────────────────────────────────────
# Gram Setu — Nginx Reverse Proxy
#
# To use:
#   sudo cp gram_setu.conf /etc/nginx/sites-available/gram_setu
#   sudo ln -s /etc/nginx/sites-available/gram_setu /etc/nginx/sites-enabled/gram_setu
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

upstream gram_setu_backend {
    server 192.168.53.234:3000;
}

server {
    listen 80;
    server_name _;   # Listen on any hostname / IP

    # ── Proxy ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass          http://gram_setu_backend;

        proxy_connect_timeout   5s;
        proxy_send_timeout      15s;
        proxy_read_timeout      15s;

        # Forward real client info to the Node.js backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health Check Endpoint ───────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "Nginx proxy is alive\n";
        add_header Content-Type text/plain;
    }
}
